name: "CI"

on:
  pull_request:
  push:
    # '**'는 슬래시가 포함된 이름(dependabot/...)까지 포함한 모든 브랜치를 뜻한다.
    # 태그 push에는 반응하지 않는다.
    branches:
      - '**'

# 같은 브랜치에 연속으로 push하면 진행 중이던 이전 실행을 취소한다.
# PR 이벤트에서 github.ref는 refs/pull/N/merge가 되므로,
# 같은 PR의 연속 push를 묶으려면 head_ref(원본 브랜치명)를 먼저 본다.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# 로컬 입구는 npm run ci 하나이고, 여기서는 그 조각(test:rust, test:ts)을
# 잡으로 나눠 병렬로 돌린다. 벽시계가 합이 아니라 긴 쪽(Rust)이 된다.
# package.json의 ci에 조각을 더하면 여기에도 잡을 더해야 합이 같다.
jobs:
  rust:
    permissions:
      contents: read

    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: test
        run: npm run test:rust

  ts:
    permissions:
      contents: read

    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: install frontend dependencies
        # npm install과 달리 락파일을 고치지 않고 그대로 설치한다.
        # 같은 커밋이면 항상 같은 의존성으로 테스트된다.
        # audit은 Dependabot이 맡으므로 CI 결과와 묶지 않는다.
        run: npm ci --no-audit

      - name: test
        run: npm run test:ts
