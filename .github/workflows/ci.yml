name: "CI"

on:
  pull_request:
  push:
    # '**'는 슬래시가 포함된 이름(dependabot/...)까지 포함한 모든 브랜치를 뜻한다.
    # 태그 push에는 반응하지 않는다.
    branches:
      - '**'

# 같은 브랜치에 연속으로 push하면 진행 중이던 이전 실행을 취소한다.
# PR 이벤트에서 github.ref는 refs/pull/N/merge가 되므로,
# 같은 PR의 연속 push를 묶으려면 head_ref(원본 브랜치명)를 먼저 본다.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # **관문의 정의는 `gate.yml` 하나다.** 여기에 단계를 풀어 쓰지 마라 — 그러면
  # `publish.yml`과 갈리고, 갈리면 **릴리스가 CI보다 관대해진다.** 이 저장소는 그
  # 끝에 있었다(`publish.yml`이 검사를 하나도 돌리지 않았다).
  gate:
    name: Gate
    permissions:
      contents: read
    uses: ./.github/workflows/gate.yml
